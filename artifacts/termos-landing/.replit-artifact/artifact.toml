kind = "web"
previewPath = "/"
title = "Termos Personalizados"
version = "1.0.0"
id = "artifacts/termos-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20571

[services.development]
run = "pnpm --filter @workspace/termos-landing run dev"

# Producción corre server.mjs (no hosting estático): es lo que da compresión
# brotli/gzip, Cache-Control immutable en /assets, llms.txt y 404 reales.
# Con serve = "static" todo eso se pierde (JS ~4x más pesado y sin caché).
# Ver RESULTADOS.md y `pnpm run check:prod`. /api/* lo atiende el artefacto
# del API Server (router por rutas), por eso EMBEDDED_API = "false".
[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/termos-landing", "run", "build"]

[services.production.run]
args = ["node", "artifacts/termos-landing/server.mjs"]

[services.production.run.env]
PORT = "20571"
NODE_ENV = "production"
EMBEDDED_API = "false"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "20571"
BASE_PATH = "/"
