<!DOCTYPE html>
<html lang="es-PY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager — deferred.
         gtm.js weighs ~113 KB compressed; injected eagerly it competes with the
         entry JS/CSS/LCP image for bandwidth and main thread on mobile. The
         dataLayer starts queueing immediately (no events are lost), but the
         script itself loads on the FIRST of: user interaction (pointer/key/
         scroll) or 3s after window.load. The preconnect warms the connection so
         the eventual fetch is fast. -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <script>
    window.dataLayer=window.dataLayer||[];
    window.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
    (function(){
      var done=false;
      function load(){
        if(done)return;done=true;
        var j=document.createElement('script');j.async=true;
        j.src='https://www.googletagmanager.com/gtm.js?id=GTM-5T5V9NTQ';
        document.head.appendChild(j);
        evs.forEach(function(e){removeEventListener(e,load)});
      }
      var evs=['pointerdown','keydown','scroll','touchstart'];
      evs.forEach(function(e){addEventListener(e,load,{passive:true,once:true})});
      if(document.readyState==='complete'){setTimeout(load,3000);}
      else{addEventListener('load',function(){setTimeout(load,3000)});}
    })();
    </script>
    <!-- End Google Tag Manager -->

    <title>Creativa Studio — Termos y vasos grabados e impresos en 360°</title>
    <meta
      name="description"
      content="Grabado láser e impresión a todo color en 360° sobre termos y vasos, con nuestra impresora cilíndrica Dacen F5. También cuero, madera y cristal. Diseñalo online en 3D y retiralo en nuestro local de Avda. España."
    />

    <!-- Canonical: the SPA fallback answers 200 on ANY path, so without this

    <link rel="canonical" href="https://creativastudio.marketplace.com.py/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PY" />
    <meta property="og:site_name" content="Creativa Studio" />

         Versioned filename (v2, v3, ...): WhatsApp caches by URL, so a design
         change must ship under a NEW name to bust its cache. Regenerate with
         scripts/generate-og-cover.sh. -->
    <meta property="og:image" content="https://creativastudio.marketplace.com.py/og-cover-v5.jpg" />

    <meta
      name="twitter:description"
      content="Tu diseño en toda la vuelta del vaso, a todo color, o grabado láser a medida. Diseñalo online en 3D."

    <meta name="twitter:image" content="https://creativastudio.marketplace.com.py/og-cover-v5.jpg" />

    <!-- Fonts are self-hosted (see @font-face in index.css) — no third-party
         connection blocks render. Inter is the body font. The two Cronos Pro
         faces are the hero <h1> (Light + italic span): now that the hero is
         pre-rendered into this HTML it paints before the CSS-discovered fonts
         would even be requested, so without these preloads the late swap
         shifted the carousel (CLS) and pushed LCP back. They are Latin subsets
         (~34 + 36 KB). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Cronos-Pro-Light-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Cronos-Pro-Display-Italic-latin.woff2" crossorigin>

    <!-- Preload the hero collage's main photo (vaso impreso en 360°) — the
         LCP image on desktop. imagesrcset/imagesizes must stay identical to the
         first <img> of COLLAGE in hero.tsx (HERO_IMAGE_SIZES), or the preload is
         wasted. On phones the <h1> is the LCP and the photo strip uses -700. -->
    <link
      rel="preload"
      as="image"
      href="/galeria/vaso-360.webp"
      imagesrcset="/galeria/vaso-360-700.webp 700w, /galeria/vaso-360.webp 900w"
      imagesizes="(min-width: 1024px) 400px, 150px"
      media="(min-width: 1024px)"
      fetchpriority="high"
    >
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5T5V9NTQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Dos raíces de React dentro del mismo contenedor de página:
         #hero-root llega pre-renderizado en el build (scripts/prerender.mjs
         reemplaza este div exacto — no cambiar sus atributos) y main.tsx lo
         hidrata; #root recibe el resto de la app desde un chunk aparte.
         display:contents mantiene al header sticky y a las secciones como
         hijos directos del contenedor flex, igual que antes. -->
    <!-- overflow-x: clip (no hidden): hidden convierte al contenedor en el
         scroller del header sticky y el header dejaba de quedar fijo. Los
         navegadores sin clip (Safari < 16) se quedan con hidden. -->
    <div style="min-height:100dvh;width:100%;display:flex;flex-direction:column;overflow-x:hidden;overflow-x:clip">
      <div id="hero-root" style="display:contents"></div>
      <div id="root" style="display:contents"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
