openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Customizer order operations
  - name: catalog
    description: Product catalog synced from the Odoo ecommerce
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Engravable product catalog from Odoo
      description: >
        Published Odoo products that the customizer can personalize, with their
        variants (real colors, sizes), public prices and stock. Cached on the
        server for a few minutes; if Odoo is unreachable the last good copy is
        served. When Odoo is not configured, `source` is "none" and `products`
        is empty — the customizer then falls back to its built-in catalog.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a customizer order
      description: >
        Creates an order from the customizer's final step. Accepts the
        customization specs plus the rendered preview image as a base64 data
        URL (~1080px JPEG/PNG, decoded size capped at 3MB). Returns the
        human-readable order number and the permanent public URL of the
        stored preview image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by its order number
      description: Returns the full order record (internal use).
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  schemas:
    Catalog:
      type: object
      properties:
        source:
          type: string
          enum: [odoo, none]
        updatedAt:
          type: [string, "null"]
          description: ISO timestamp of the last successful sync
        stale:
          type: boolean
          description: True when Odoo failed and an older copy is being served
        currency:
          type: string
          description: Currency symbol for display, e.g. "Gs."
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        engraving:
          $ref: "#/components/schemas/CatalogEngraving"
      required: [source, updatedAt, stale, currency, products, engraving]
    CatalogEngraving:
      type: object
      description: >
        Engraving service prices read from Odoo service products by internal
        reference (GRAB-NOMBRES, GRAB-ICONO, GRAB-LOGO). Null when missing.
      properties:
        names:
          type: [number, "null"]
        drawing:
          type: [number, "null"]
        logo:
          type: [number, "null"]
      required: [names, drawing, logo]
    CatalogProduct:
      type: object
      properties:
        id:
          type: integer
          description: Odoo product.template id
        name:
          type: string
        brand:
          type: string
          description: Product brand as loaded in Odoo (e.g. Hydrate). The customizer groups the catalog by it.
        productType:
          type: string
          description: Customizer 3D profile (termo, termo-mate, termo-mate-forge, vaso, vaso-hydrate, vaso-sunbeam, vaso-manija, hoppie, botella-ancha, jug, guampa, copa, botella, chopera)
        material:
          type: string
          description: Customizer material id (acero, inox, cuero, cristal)
        url:
          type: [string, "null"]
          description: Absolute product page URL in the Odoo shop
        imageUrl:
          type: [string, "null"]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CatalogVariant"
      required: [id, name, brand, productType, material, url, imageUrl, variants]
    CatalogVariant:
      type: object
      properties:
        id:
          type: integer
          description: Odoo product.product id
        sku:
          type: [string, "null"]
        colorName:
          type: [string, "null"]
        colorHex:
          type: [string, "null"]
        size:
          type: [string, "null"]
        price:
          type: number
          description: Public sales price (list price + variant extra)
        available:
          type: [number, "null"]
          description: Units available to sell; null when stock is not tracked
        inStock:
          type: boolean
          description: Whether this variant can be ordered right now
      required: [id, sku, colorName, colorHex, size, price, available, inStock]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    CreateOrderRequest:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          maxLength: 120
          description: Product type (Termo, Chopera, Hoppie, …)
        material:
          type: string
          minLength: 1
          maxLength: 120
        color:
          type: string
          maxLength: 120
          description: Color name + hex, e.g. "Borgoña (#6d2434)"
        technique:
          type: string
          minLength: 1
          maxLength: 120
          description: Grabado láser / Impresión UV / Plotter de corte
        customText:
          type: string
          maxLength: 500
        font:
          type: string
          maxLength: 120
        textColor:
          type: string
          maxLength: 40
          description: Only when technique is UV printing
        iconName:
          type: string
          maxLength: 120
        hasUploadedImage:
          type: boolean
          default: false
        designState:
          type: object
          additionalProperties: true
          description: Full snapshot of the design state, enough to reproduce it
        previewImage:
          type: string
          description: Rendered preview as a base64 data URL (image/png or image/jpeg)
        customImage:
          type: string
          description: >-
            Original uploaded logo/photo as a data URL, at the highest
            resolution the client has. Used only to embed the artwork in the
            internal production file; never echoed back to the client.
        productionImage:
          type: string
          description: >-
            Production artwork as a PNG data URL (JPEG for a full-wrap 360°
            background), already at real size (e.g. the unwrapped 360° print for
            the Dacen F5 UV cylinder printer, opened in RIPrint). Internal use
            only; never echoed back to the client.
      required:
        - product
        - material
        - technique
        - designState
    CreateOrderResponse:
      type: object
      properties:
        orderNumber:
          type: string
          description: Human-readable order number, e.g. CS-0042
        previewImageUrl:
          type: string
          nullable: true
          description: Permanent public URL of the stored preview image
      required:
        - orderNumber
        - previewImageUrl
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
          enum: [nueva, en_proceso, completada, cancelada]
        product:
          type: string
        material:
          type: string
        color:
          type: string
          nullable: true
        technique:
          type: string
        customText:
          type: string
          nullable: true
        font:
          type: string
          nullable: true
        textColor:
          type: string
          nullable: true
        iconName:
          type: string
          nullable: true
        hasUploadedImage:
          type: boolean
        designState:
          type: object
          additionalProperties: true
        previewImagePath:
          type: string
          nullable: true
        previewImageUrl:
          type: string
          nullable: true
        productionFilePath:
          type: string
          nullable: true
          description: >-
            Internal production SVG path. Only present when the request carries
            the internal access key; never exposed to clients.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - orderNumber
        - status
        - product
        - material
        - color
        - technique
        - customText
        - font
        - textColor
        - iconName
        - hasUploadedImage
        - designState
        - previewImagePath
        - previewImageUrl
        - createdAt

